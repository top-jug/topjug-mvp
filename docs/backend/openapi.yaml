    MembershipReference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    GymGradeReference:
      type: object
      required: [id, code, label, color, standardCode, rank]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        color:
          type: string
        standardCode:
          type: [string, 'null']
        rank:
          type: integer
    RecordListResponse:
      type: object
      description: A page containing completed records only, ordered by `createdAt` descending and then `id` descending.
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompletedRecordSummary'
        meta:
          type: object
          required: [nextCursor]
          properties:
            nextCursor:
              type: [string, 'null']
              maxLength: 256
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier. Clients must not branch on `message`.
            message:
              type: string
