    CompletedRecordDetail:
      allOf:
        - $ref: '#/components/schemas/RecordDetail'
        - type: object
          properties:
            status: { type: string, const: completed }
            endedAt: { type: string, format: date-time }
    CancelledRecordDetail:
      allOf:
        - $ref: '#/components/schemas/RecordDetail'
        - type: object
          properties:
            status: { type: string, const: cancelled }
