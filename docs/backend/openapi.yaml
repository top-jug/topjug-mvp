openapi: 3.1.0
info:
  title: TopJug API
  version: 0.1.0
  description: |
    Runtime-aligned API contract for the TopJug MVP backend. Every response includes
    `x-request-id` and `Cache-Control: no-store` for responses produced by documented handlers. Error `code` values are stable client
    identifiers; localized `message` text is not stable. Nullable response fields are
    emitted as JSON null when present, while non-required fields may be omitted. Deprecated
    record `sessionType` request and response fields remain temporarily for stale clients;
    issue #86 will remove them with the database column and enum.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the application process is serving requests
      servers:
        - url: /api
      security: []
      responses:
        '200':
          description: Process is healthy
          headers:
            x-request-id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ready:
    get:
      operationId: getReadiness
      summary: Check required configuration and the runtime database connection
      servers:
        - url: /api
      security: []
      responses:
        '200':
          description: Service is ready
          headers:
            x-request-id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/register:
    post:
      operationId: register
      summary: Create an account and start a refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and access token; refresh JWT is set as an HttpOnly cookie
          headers:
            x-request-id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      operationId: login
      summary: Verify credentials and start a refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User and access token; refresh JWT is set as an HttpOnly cookie
          headers:
            x-request-id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh JWT and issue a new access JWT
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token; rotated refresh JWT is set as an HttpOnly cookie
          headers:
            x-request-id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh session and clear its cookie
      security: []
      responses:
        '204':
          description: Logged out or already logged out
          headers:
            x-request-id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          headers: &standardResponseHeaders
            x-request-id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /gyms:
    get:
      operationId: listGyms
      summary: Search active gyms for search and home screens
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: regionCode, in: query, schema: { type: string, maxLength: 40 } }
        - { name: facility, in: query, schema: { type: string, maxLength: 40 } }
        - { name: tag, in: query, schema: { type: string, maxLength: 40 } }
        - name: operationStatus
          in: query
          schema: { type: string, enum: [active, temporarily_closed, closed, opening_soon], default: active }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Up to `limit` gyms ordered by name then branch name; no cursor or total is available
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/GymSummary' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /gyms/{gymId}:
    get:
      operationId: getGym
      summary: Get complete gym detail data
      security: []
      parameters:
        - { $ref: '#/components/parameters/GymIdPath' }
      responses:
        '200':
          description: Gym details, media, hours, grades, walls, sectors, and setting events
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/GymDetail' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /me/saved-gyms:
    get:
      operationId: listSavedGyms
      summary: List the current user's saved gyms
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Saved gyms
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/SavedGymSummary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /me/recent-gyms:
    get:
      operationId: listRecentVisitedGyms
      summary: List the current user's three most recently visited gyms
      description: Returns unique gyms from completed records only, ordered by the latest `startedAt` descending and record ID descending as a stable tie-breaker.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Up to three unique recently visited gyms
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 3
                    items: { $ref: '#/components/schemas/RecentVisitedGym' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /me/saved-gyms/{gymId}:
    parameters:
      - { $ref: '#/components/parameters/GymIdPath' }
    put:
      operationId: saveGym
      summary: Save a gym idempotently
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Gym saved
          headers: *standardResponseHeaders
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: unsaveGym
      summary: Remove a saved gym idempotently
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Gym removed
          headers: *standardResponseHeaders
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /memberships:
    get:
      operationId: listMemberships
      summary: List active memberships and eligible gyms
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Membership list
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Membership' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createMembership
      summary: Create a count or period membership
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MembershipInput' } } }
      responses:
        '201':
          description: Membership created
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/Membership' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /memberships/{membershipId}:
    parameters:
      - name: membershipId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: replaceMembership
      summary: Replace editable membership data and eligible gyms
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MembershipUpdateInput' } } }
      responses:
        '200':
          description: Membership updated
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/Membership' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: archiveMembership
      summary: Archive a membership while retaining its usage ledger
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Membership archived
          headers: *standardResponseHeaders
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /setting-events:
    get:
      operationId: listSettingEvents
      summary: List gym setting events in a time range
      security: []
      parameters:
        - { $ref: '#/components/parameters/FromRequired' }
        - { $ref: '#/components/parameters/ToRequired' }
        - { $ref: '#/components/parameters/GymId' }
        - { name: status, in: query, schema: { type: string, enum: [scheduled, completed, cancelled] } }
      responses:
        '200':
          description: Setting events with affected walls and sectors
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/SettingEventWithGym' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /records/sessions:
    get:
      operationId: getActiveRecordSession
      summary: Recover the current user's in-progress session, pause state, and draft counts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active session or null when none exists
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf: [{ $ref: '#/components/schemas/ActiveRecordSession' }, { type: 'null' }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: startRecordSession
      summary: Start a recoverable in-progress climbing session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartRecordSessionRequest' } } }
      responses:
        '201':
          description: In-progress session created
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/StartedRecordSession' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /records:
    get:
      operationId: listRecords
      summary: List the current user's completed climbing records
      description: Results are ordered by `createdAt` descending and then `id` descending. `sends` and `attempts` are aggregates over each record's count rows.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/GymId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Record page
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createRecord
      summary: Create a climbing record for the current user
      description: Creates a record directly in the `completed` state. Use `/records/sessions` for the in-progress lifecycle.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordRequest'
      responses:
        '201':
          description: Created record
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CompletedRecordDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /records/{recordId}:
    get:
      operationId: getRecord
      summary: Get one climbing record owned by the current user
      description: Returns any persisted lifecycle state (`in_progress`, `completed`, or `cancelled`) and aggregate `sends` and `attempts` calculated from count rows.
      security:
        - bearerAuth: []
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Record detail
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RecordDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /records/{recordId}/shares:
    get:
      operationId: listRecordShares
      summary: List revocable share metadata without exposing raw tokens
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RecordIdPath' }
      responses:
        '200':
          description: Share lifecycle metadata
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/ShareSummary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createRecordShare
      summary: Create a revocable public share token and optionally attach an S3 image asset
      description: Only completed records can be shared. There is no media upload operation; `mediaAssetId`, when supplied, must already identify a ready image owned by the user.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RecordIdPath' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateShareRequest' } } }
      responses:
        '201':
          description: Share token returned once
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/CreatedShare' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /records/{recordId}/counts:
    put:
      operationId: replaceRecordSessionCounts
      summary: Persist draft counts for an in-progress session
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RecordIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [counts]
              properties:
                counts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CreateRecordCount' } }
      responses:
        '200':
          description: Draft counts replaced
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/RecordDetail' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /records/{recordId}/shares/{shareId}:
    delete:
      operationId: revokeRecordShare
      summary: Revoke a share owned by the current user
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RecordIdPath' }
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Share revoked
          headers: *standardResponseHeaders
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /shares/{token}:
    get:
      operationId: getRecordShare
      summary: Resolve an active public record share
      description: Expiration is evaluated at request time; a persisted active share past `expiresAt` returns `410 SHARE_EXPIRED`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 40, maxLength: 100 }
      responses:
        '200':
          description: Public record share
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/PublicShare' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /records/{recordId}/pause:
    post:
      operationId: pauseRecordSession
      summary: Pause an in-progress record
      description: Valid only while the owned record is `in_progress` and not already paused.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RecordIdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordTransitionRequest' } } } }
      responses:
        '200':
          description: Pause interval created
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/RecordPause' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /records/{recordId}/resume:
    post:
      operationId: resumeRecordSession
      summary: Resume a paused record
      description: Valid only while the owned record is `in_progress` with an open pause interval.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RecordIdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordTransitionRequest' } } } }
      responses:
        '200':
          description: Pause interval closed
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/RecordPause' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /records/{recordId}/complete:
    post:
      operationId: completeRecordSession
      summary: Complete a record, calculate active time, and consume a count membership atomically
      description: Valid only for an `in_progress` record. The response is narrowed to `completed`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RecordIdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteRecordSessionRequest' } } } }
      responses:
        '200':
          description: Session completed
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/CompletedRecordDetail' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /records/{recordId}/cancel:
    post:
      operationId: cancelRecordSession
      summary: Cancel an in-progress record without consuming a membership
      description: Valid only for an `in_progress` record. The response is narrowed to `cancelled`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RecordIdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordTransitionRequest' } } } }
      responses:
        '200':
          description: Session cancelled
          headers: *standardResponseHeaders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/CancelledRecordDetail' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: topjug_refresh
  headers:
    RequestId:
      description: UUID used to correlate the request with server logs; a valid incoming value is preserved.
      schema: { type: string, format: uuid }
    CacheControl:
      description: API responses are not cacheable.
      schema: { type: string, const: no-store }
    RefreshCookie:
      description: Sets, rotates, or clears the HttpOnly `topjug_refresh` cookie scoped to `/api/v1/auth`.
      schema: { type: string }
    WwwAuthenticate:
      description: Authentication scheme required for protected resources.
      schema: { type: string, const: Bearer }
    RetryAfter:
      description: Seconds to wait before retrying after an authentication rate limit.
      schema: { type: integer, const: 900 }
  parameters:
    GymIdPath:
      name: gymId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecordIdPath:
      name: recordId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FromRequired:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    ToRequired:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    From:
      name: from
      in: query
      description: Include records starting at or after this instant.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Include records starting at or before this instant.
      schema:
        type: string
        format: date-time
    GymId:
      name: gymId
      in: query
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: The opaque value returned as `nextCursor` by the previous page.
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request
      headers:
        x-request-id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not owned by the current user
      headers:
        x-request-id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Database or identity configuration is not available
      headers:
        x-request-id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired, reused, or revoked token
      headers:
        x-request-id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        WWW-Authenticate: { $ref: '#/components/headers/WwwAuthenticate' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The requested change conflicts with current resource state or a uniqueness constraint
      headers:
        x-request-id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too many failed authentication attempts
      headers:
        x-request-id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: JSON request body exceeds 64KB
      headers:
        x-request-id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: The share token exists but has expired
      headers:
        x-request-id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SHARE_EXPIRED
              message: 공유 링크가 만료되었습니다.
    InternalServerError:
      description: Unexpected server failure
      headers:
        x-request-id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, timestamp]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: topjug-mvp }
        timestamp: { type: string, format: date-time }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ready }
        service: { type: string, const: topjug-mvp }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 40
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, accessToken, accessTokenExpiresIn]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
            accessTokenExpiresIn:
              type: integer
              example: 900
    TokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, accessTokenExpiresIn]
          properties:
            accessToken:
              type: string
            accessTokenExpiresIn:
              type: integer
              example: 900
    User:
      type: object
      required: [id, email, displayName, homeRegionCode, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        homeRegionCode:
          type: [string, 'null']
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        homeRegion:
          oneOf:
            - type: object
              required: [code, name, parentCode]
              properties:
                code: { type: string }
                name: { type: string }
                parentCode: { type: [string, 'null'] }
            - type: 'null'
        stats:
          type: object
          required: [savedGyms, memberships, recordsThisMonth]
          properties:
            savedGyms: { type: integer, minimum: 0 }
            memberships: { type: integer, minimum: 0 }
            recordsThisMonth: { type: integer, minimum: 0 }
    MediaReference:
      type: object
      required: [id, storageKey, contentType, url]
      properties:
        id: { type: string, format: uuid }
        storageKey: { type: string }
        contentType: { type: string }
        url: { type: [string, 'null'], format: uri }
    GymMediaDetail:
      type: object
      required: [id, storageKey, contentType, url, type, altText, sortOrder]
      properties:
        id: { type: string, format: uuid }
        storageKey: { type: string }
        contentType: { type: string }
        url: { type: [string, 'null'], format: uri }
        type: { type: string, enum: [logo, cover, photo, map, sector_map] }
        altText: { type: [string, 'null'] }
        sortOrder: { type: integer, minimum: 0 }
    GymSummary:
      type: object
      required: [id, name, branchName, address, regionCode, operationStatus, facilities, cover]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        branchName: { type: [string, 'null'] }
        address: { type: string }
        regionCode: { type: [string, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        operationStatus: { type: string, enum: [active, temporarily_closed, closed, opening_soon] }
        facilities: { type: array, items: { type: string } }
        calendarColor: { type: [string, 'null'] }
        calendarTextColor: { type: [string, 'null'] }
        brand:
          oneOf:
            - $ref: '#/components/schemas/GymBrand'
            - type: 'null'
        cover:
          oneOf: [{ $ref: '#/components/schemas/MediaReference' }, { type: 'null' }]
        tags:
          type: array
          items: { $ref: '#/components/schemas/GymTag' }
        dayPassPrice:
          oneOf: [{ $ref: '#/components/schemas/GymPrice' }, { type: 'null' }]
    GymBrand:
      type: object
      required: [id, name, websiteUrl, instagramUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        websiteUrl: { type: [string, 'null'], format: uri }
        instagramUrl: { type: [string, 'null'], format: uri }
    SavedGymSummary:
      allOf:
        - $ref: '#/components/schemas/GymSummary'
        - type: object
          required: [savedAt]
          properties:
            savedAt: { type: string, format: date-time }
    RecentVisitedGym:
      type: object
      required: [gym, lastVisitedAt]
      properties:
        gym: { $ref: '#/components/schemas/GymReference' }
        lastVisitedAt: { type: string, format: date-time }
    GymTag:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
    GymDetail:
      allOf:
        - $ref: '#/components/schemas/GymSummary'
        - type: object
          required: [operatingHoursNote, parkingInfo, media, operatingHours, operatingHourOverrides, prices, grades, walls, settingEvents, sources]
          properties:
            phone: { type: [string, 'null'] }
            websiteUrl: { type: [string, 'null'], format: uri }
            instagramUrl: { type: [string, 'null'], format: uri }
            nearbyDirections: { type: [string, 'null'] }
            operatingHoursNote: { type: [string, 'null'] }
            parkingInfo: { type: [string, 'null'] }
            media:
              type: array
              items: { $ref: '#/components/schemas/GymMediaDetail' }
            operatingHours:
              type: array
              items: { $ref: '#/components/schemas/OperatingHours' }
            operatingHourOverrides:
              type: array
              items: { $ref: '#/components/schemas/OperatingHoursOverride' }
            prices:
              type: array
              items: { $ref: '#/components/schemas/GymPrice' }
            grades:
              type: array
              items: { $ref: '#/components/schemas/GymGradeReference' }
            walls:
              type: array
              items: { $ref: '#/components/schemas/GymWall' }
            settingEvents:
              type: array
              items: { $ref: '#/components/schemas/SettingEvent' }
            sources:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, enum: [operator, official_site, public_data, user_report] }
                  sourceName: { type: string }
                  sourceUrl: { type: [string, 'null'], format: uri }
                  verifiedAt: { type: [string, 'null'], format: date-time }
                  lastCheckedAt: { type: [string, 'null'], format: date-time }
    GymPrice:
      type: object
      required: [amount, currency, rawText]
      properties:
        amount: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, enum: [KRW] }
        rawText: { type: string }
        type: { type: string, enum: [day_pass, shoe_rental] }
    OperatingHours:
      type: object
      required: [dayOfWeek, sequence, opensAt, closesAt, isClosed]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        sequence: { type: integer, minimum: 0 }
        opensAt: { type: [string, 'null'], format: time }
        closesAt: { type: [string, 'null'], format: time }
        isClosed: { type: boolean }
    OperatingHoursOverride:
      type: object
      required: [date, sequence, opensAt, closesAt, isClosed]
      properties:
        date: { type: string, format: date }
        sequence: { type: integer, minimum: 0 }
        opensAt: { type: [string, 'null'], format: time }
        closesAt: { type: [string, 'null'], format: time }
        isClosed: { type: boolean }
        note: { type: [string, 'null'] }
    GymWall:
      type: object
      required: [id, code, name, sortOrder, isActive, mapMedia, sectors]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        mapMedia:
          oneOf: [{ $ref: '#/components/schemas/MediaReference' }, { type: 'null' }]
        sectors:
          type: array
          items: { $ref: '#/components/schemas/GymSector' }
    GymSector:
      type: object
      required: [id, code, name, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        mapMediaAssetId: { type: [string, 'null'], format: uuid }
        mapMedia:
          oneOf: [{ $ref: '#/components/schemas/MediaReference' }, { type: 'null' }]
    SettingEventSector:
      allOf:
        - $ref: '#/components/schemas/GymSector'
        - type: object
          required: [wall]
          properties:
            wall:
              type: object
              required: [id, code, name]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
    SettingEvent:
      type: object
      required: [id, title, status, startsAt, endsAt, note, sectors]
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        status: { type: string, enum: [scheduled, completed, cancelled] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        sectors: { type: array, items: { $ref: '#/components/schemas/GymSector' } }
        gym:
          type: object
          required: [id, name, branchName, address, calendarColor, calendarTextColor, logo]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            branchName: { type: [string, 'null'] }
            address: { type: string }
            calendarColor: { type: [string, 'null'] }
            calendarTextColor: { type: [string, 'null'] }
            logo:
              oneOf: [{ $ref: '#/components/schemas/MediaReference' }, { type: 'null' }]
    SettingEventWithGym:
      allOf:
        - $ref: '#/components/schemas/SettingEvent'
        - type: object
          required: [gym, sectors]
          properties:
            sectors: { type: array, items: { $ref: '#/components/schemas/SettingEventSector' } }
    MembershipInput:
      type: object
      additionalProperties: false
      description: Membership replacement payload. `validFrom` and `validUntil` are timezone-aware instants, not local calendar dates.
      required: [name, type, gymIds, validFrom, validUntil]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [count, period] }
        gymIds: { type: array, maxItems: 30, uniqueItems: true, items: { type: string, format: uuid } }
        totalUses: { type: [integer, 'null'], minimum: 0 }
        remainingUses:
          type: [integer, 'null']
          minimum: 0
          description: For count memberships this must not exceed `totalUses`.
        validFrom: { type: string, format: date-time }
        validUntil:
          type: string
          format: date-time
          description: Must be the same instant as or later than `validFrom`.
        note: { type: [string, 'null'], maxLength: 1000 }
        homeFavorite:
          type: boolean
          default: false
          description: When omitted, the server stores `false`. A true value requires `homeOrder`; false requires `homeOrder` to be omitted or null.
        homeOrder:
          type: [integer, 'null']
          minimum: 0
          maximum: 2
          description: Required and non-null only when `homeFavorite` is true; the position must be unoccupied and at most three favorites are allowed.
      allOf:
        - if:
            required: [type]
            properties: { type: { const: count } }
          then:
            required: [totalUses, remainingUses]
            properties:
              totalUses: { type: integer, minimum: 0 }
              remainingUses: { type: integer, minimum: 0 }
          else:
            properties:
              totalUses: { type: 'null' }
              remainingUses: { type: 'null' }
        - if:
            required: [homeFavorite]
            properties: { homeFavorite: { const: true } }
          then:
            required: [homeOrder]
            properties: { homeOrder: { type: integer, minimum: 0, maximum: 2 } }
          else:
            properties: { homeOrder: { type: 'null' } }
    MembershipUpdateInput:
      type: object
      additionalProperties: false
      description: Full membership replacement payload. `expectedUpdatedAt` prevents stale editors from restoring an outdated count balance or metadata.
      required: [name, type, gymIds, validFrom, validUntil, expectedUpdatedAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [count, period] }
        gymIds: { type: array, maxItems: 30, uniqueItems: true, items: { type: string, format: uuid } }
        totalUses: { type: [integer, 'null'], minimum: 0 }
        remainingUses:
          type: [integer, 'null']
          minimum: 0
          description: For count memberships this must not exceed `totalUses`.
        validFrom: { type: string, format: date-time }
        validUntil:
          type: string
          format: date-time
          description: Must be the same instant as or later than `validFrom`.
        note: { type: [string, 'null'], maxLength: 1000 }
        homeFavorite:
          type: boolean
          default: false
          description: A true value requires `homeOrder`; false requires `homeOrder` to be omitted or null.
        homeOrder:
          type: [integer, 'null']
          minimum: 0
          maximum: 2
          description: Required and non-null only when `homeFavorite` is true.
        expectedUpdatedAt:
          type: string
          format: date-time
          description: The exact `updatedAt` value from the membership being replaced. A stale value returns `409 MEMBERSHIP_CHANGED`.
      allOf:
        - if:
            required: [type]
            properties: { type: { const: count } }
          then:
            required: [totalUses, remainingUses]
            properties:
              totalUses: { type: integer, minimum: 0 }
              remainingUses: { type: integer, minimum: 0 }
          else:
            properties:
              totalUses: { type: 'null' }
              remainingUses: { type: 'null' }
        - if:
            required: [homeFavorite]
            properties: { homeFavorite: { const: true } }
          then:
            required: [homeOrder]
            properties: { homeOrder: { type: integer, minimum: 0, maximum: 2 } }
          else:
            properties: { homeOrder: { type: 'null' } }
    Membership:
      type: object
      additionalProperties: false
      required: [id, name, type, gymIds, gyms, totalUses, remainingUses, validFrom, validUntil, note, homeFavorite, homeOrder, createdAt, updatedAt, eligibilityStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [count, period] }
        gymIds: { type: array, items: { type: string, format: uuid } }
        gyms: { type: array, items: { $ref: '#/components/schemas/GymReference' } }
        totalUses: { type: [integer, 'null'], minimum: 0 }
        remainingUses: { type: [integer, 'null'], minimum: 0 }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        note: { type: [string, 'null'] }
        homeFavorite: { type: boolean }
        homeOrder: { type: [integer, 'null'], minimum: 0, maximum: 2 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        eligibilityStatus: { type: string, enum: [active, unassigned, not_started, expired, exhausted] }
    StartRecordSessionRequest:
      type: object
      additionalProperties: false
      description: A membership access session requires `membershipId`; other access types prohibit it.
      required: [gymId, accessType, startedAt, mode]
      properties:
        gymId: { type: string, format: uuid }
        accessType: { type: string, enum: [day_pass, membership, other] }
        membershipId: { type: [string, 'null'], format: uuid }
        startedAt: { type: string, format: date-time }
        mode: { type: string, enum: [easy, normal] }
        sessionType:
          type: string
          enum: [free, training, project]
          deprecated: true
          description: Legacy compatibility input. Accepted but ignored for new writes; removal is tracked by issue #86.
        note: { type: [string, 'null'], maxLength: 2000 }
      allOf:
        - if:
            required: [accessType]
            properties: { accessType: { const: membership } }
          then:
            required: [membershipId]
            properties: { membershipId: { type: string, format: uuid } }
          else:
            properties: { membershipId: { type: 'null' } }
    StartedRecordSession:
      type: object
      required: [id, userId, gymId, membershipId, accessType, status, sessionType, startedAt, endedAt, activeDurationSeconds, rating, mode, note, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        gymId: { type: string, format: uuid }
        membershipId: { type: [string, 'null'], format: uuid }
        accessType: { type: string, enum: [day_pass, membership, other] }
        status: { type: string, enum: [in_progress] }
        sessionType:
          type: string
          enum: [free, training, project]
          deprecated: true
          description: Legacy response field retained for stale clients; removal is tracked by issue #86.
        startedAt: { type: string, format: date-time }
        endedAt: { type: 'null' }
        activeDurationSeconds: { type: 'null' }
        rating: { type: 'null' }
        mode: { type: string, enum: [easy, normal] }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecordTransitionRequest:
      type: object
      additionalProperties: false
      properties:
        at: { type: string, format: date-time }
    RecordPause:
      type: object
      required: [id, recordId, pausedAt, resumedAt]
      properties:
        id: { type: string, format: uuid }
        recordId: { type: string, format: uuid }
        pausedAt: { type: string, format: date-time }
        resumedAt: { type: [string, 'null'], format: date-time }
    ActiveRecordSession:
      allOf:
        - $ref: '#/components/schemas/RecordDetail'
        - type: object
          required: [isPaused, pauses]
          properties:
            status: { type: string, const: in_progress }
            endedAt: { type: 'null' }
            activeDurationSeconds: { type: 'null' }
            rating: { type: 'null' }
            isPaused: { type: boolean }
            pauses: { type: array, items: { $ref: '#/components/schemas/RecordPause' } }
    CompleteRecordSessionRequest:
      type: object
      additionalProperties: false
      description: The endedAt instant cannot precede the persisted session start. Count entries must use unique gymGradeId and gymSectorId pairs.
      required: [endedAt, counts]
      properties:
        endedAt: { type: string, format: date-time }
        rating: { type: [number, 'null'], minimum: 0.5, maximum: 5, multipleOf: 0.5 }
        note: { type: [string, 'null'], maxLength: 2000 }
        counts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CreateRecordCount' } }
    CreateShareRequest:
      type: object
      additionalProperties: false
      properties:
        mediaAssetId: { type: [string, 'null'], format: uuid }
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When present, this instant must be later than the server's current time.
    CreatedShare:
      type: object
      required: [id, token, apiPath, publicUrl, status, mediaAssetId, expiresAt, revokedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, readOnly: true }
        apiPath: { type: string }
        publicUrl: { type: [string, 'null'], format: uri }
        status: { type: string, enum: [active] }
        mediaAssetId: { type: [string, 'null'], format: uuid }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ShareSummary:
      type: object
      required: [id, status, mediaAssetId, expiresAt, revokedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [active, revoked, expired]
          description: "`expired` is derived at read time when an otherwise active share is past `expiresAt`."
        mediaAssetId: { type: [string, 'null'], format: uuid }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    PublicShare:
      type: object
      required: [id, status, expiresAt, createdAt, media, record, gym, membership]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active] }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        media:
          oneOf: [{ $ref: '#/components/schemas/MediaReference' }, { type: 'null' }]
        record:
          type: object
          required: [id, startedAt, endedAt, rating, mode, sessionType, accessType, activeDurationSeconds, sends, attempts]
          properties:
            id: { type: string, format: uuid }
            startedAt: { type: string, format: date-time }
            endedAt: { type: [string, 'null'], format: date-time }
            rating: { type: [number, 'null'] }
            mode: { type: string, enum: [easy, normal] }
            sessionType:
              type: string
              enum: [free, training, project]
              deprecated: true
              description: Legacy response field retained for stale clients; removal is tracked by issue #86.
            accessType: { type: string, enum: [day_pass, membership, other] }
            activeDurationSeconds: { type: [integer, 'null'] }
            sends: { type: integer }
            attempts: { type: integer }
        gym: { $ref: '#/components/schemas/GymReference' }
        membership:
          oneOf: [{ $ref: '#/components/schemas/MembershipReference' }, { type: 'null' }]
    CreateRecordRequest:
      type: object
      additionalProperties: false
      description: The endedAt instant cannot precede startedAt, and activeDurationSeconds cannot exceed elapsed time. Count entries must use unique gymGradeId and gymSectorId pairs. Membership access requires membershipId; other access types prohibit it.
      required: [gymId, accessType, startedAt, endedAt, mode, counts]
      properties:
        gymId:
          type: string
          format: uuid
        accessType:
          type: string
          enum: [day_pass, membership, other]
        membershipId:
          type: [string, 'null']
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        activeDurationSeconds:
          type: integer
          minimum: 0
        rating:
          type: [number, 'null']
          minimum: 0.5
          maximum: 5
          multipleOf: 0.5
        mode:
          type: string
          enum: [easy, normal]
        sessionType:
          type: string
          enum: [free, training, project]
          deprecated: true
          description: Legacy compatibility input. Accepted but ignored for new writes; removal is tracked by issue #86.
        note:
          type: [string, 'null']
          maxLength: 2000
        counts:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CreateRecordCount'
      allOf:
        - if:
            required: [accessType]
            properties: { accessType: { const: membership } }
          then:
            required: [membershipId]
            properties: { membershipId: { type: string, format: uuid } }
          else:
            properties: { membershipId: { type: 'null' } }
    CreateRecordCount:
      type: object
      additionalProperties: false
      required: [gymGradeId, gymSectorId, attempts, sends]
      properties:
        gymGradeId:
          type: string
          format: uuid
        gymSectorId:
          type: string
          format: uuid
        attempts:
          type: integer
          minimum: 0
        sends:
          type: integer
          minimum: 0
          description: Must not exceed attempts.
    RecordSummary:
      type: object
      required: [id, gym, membership, accessType, status, sessionType, startedAt, endedAt, activeDurationSeconds, rating, mode, note, sends, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        gym:
          $ref: '#/components/schemas/GymReference'
        membership:
          oneOf:
            - $ref: '#/components/schemas/MembershipReference'
            - type: 'null'
        accessType:
          type: string
          enum: [day_pass, membership, other]
        status:
          type: string
          enum: [in_progress, completed, cancelled]
        sessionType:
          type: string
          enum: [free, training, project]
          deprecated: true
          description: Legacy response field retained for stale clients; removal is tracked by issue #86.
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
        activeDurationSeconds:
          type: [integer, 'null']
        rating:
          type: [number, 'null']
        mode:
          type: string
          enum: [easy, normal]
        note:
          type: [string, 'null']
        sends:
          type: integer
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
    RecordDetail:
      allOf:
        - $ref: '#/components/schemas/RecordSummary'
        - type: object
          required: [updatedAt, counts]
          properties:
            updatedAt:
              type: string
              format: date-time
            counts:
