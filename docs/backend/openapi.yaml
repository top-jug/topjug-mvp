openapi: 3.1.0
info:
  title: TopJug API
  version: 0.1.0
  description: Initial API contract for the TopJug MVP backend.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account and start a refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and access token; refresh JWT is set as an HttpOnly cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login:
    post:
      operationId: login
      summary: Verify credentials and start a refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User and access token; refresh JWT is set as an HttpOnly cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh JWT and issue a new access JWT
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token; rotated refresh JWT is set as an HttpOnly cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh session and clear its cookie
      security: []
      responses:
        '204':
          description: Logged out or already logged out
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /records:
    get:
      operationId: listRecords
      summary: List the current user's climbing records
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/GymId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Record page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createRecord
      summary: Create a climbing record for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordRequest'
      responses:
        '201':
          description: Created record
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RecordDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /records/{recordId}:
    get:
      operationId: getRecord
      summary: Get one climbing record owned by the current user
      security:
        - bearerAuth: []
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Record detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RecordDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: topjug_refresh
  parameters:
    From:
      name: from
      in: query
      description: Include records starting at or after this instant.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Include records starting at or before this instant.
      schema:
        type: string
        format: date-time
    GymId:
      name: gymId
      in: query
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: The opaque value returned as `nextCursor` by the previous page.
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not owned by the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Database or identity configuration is not available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired, reused, or revoked token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Account cannot be created with the supplied identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too many failed authentication attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 40
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 128
          writeOnly: true
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, accessToken, accessTokenExpiresIn]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
            accessTokenExpiresIn:
              type: integer
              example: 900
    TokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, accessTokenExpiresIn]
          properties:
            accessToken:
              type: string
            accessTokenExpiresIn:
              type: integer
              example: 900
    User:
      type: object
      required: [id, email, displayName, homeRegionCode, emailVerifiedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        homeRegionCode:
          type: [string, 'null']
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateRecordRequest:
      type: object
      additionalProperties: false
      required: [gymId, startedAt, endedAt, mode, counts]
      properties:
        gymId:
          type: string
          format: uuid
        membershipId:
          type: [string, 'null']
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        rating:
          type: [number, 'null']
          minimum: 0.5
          maximum: 5
          multipleOf: 0.5
        mode:
          type: string
          enum: [easy, normal]
        counts:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CreateRecordCount'
    CreateRecordCount:
      type: object
      additionalProperties: false
      required: [gymGradeId, attempts, sends]
      properties:
        gymGradeId:
          type: string
          format: uuid
        sectorCode:
          type: [string, 'null']
          maxLength: 80
        attempts:
          type: integer
          minimum: 0
        sends:
          type: integer
          minimum: 0
          description: Must not exceed attempts.
    RecordSummary:
      type: object
      required: [id, gym, membership, startedAt, endedAt, rating, mode, sends, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        gym:
          $ref: '#/components/schemas/GymReference'
        membership:
          oneOf:
            - $ref: '#/components/schemas/MembershipReference'
            - type: 'null'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        rating:
          type: [number, 'null']
        mode:
          type: string
          enum: [easy, normal]
        sends:
          type: integer
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
    RecordDetail:
      allOf:
        - $ref: '#/components/schemas/RecordSummary'
        - type: object
          required: [updatedAt, counts]
          properties:
            updatedAt:
              type: string
              format: date-time
            counts:
              type: array
              items:
                $ref: '#/components/schemas/RecordCount'
    RecordCount:
      type: object
      required: [id, sectorCode, attempts, sends, grade]
      properties:
        id:
          type: string
          format: uuid
        sectorCode:
          type: [string, 'null']
        attempts:
          type: integer
        sends:
          type: integer
        grade:
          $ref: '#/components/schemas/GymGradeReference'
    GymReference:
      type: object
      required: [id, name, branchName]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        branchName:
          type: [string, 'null']
    MembershipReference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    GymGradeReference:
      type: object
      required: [id, code, label, color, rank]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        color:
          type: string
        rank:
          type: integer
    RecordListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RecordSummary'
        meta:
          type: object
          required: [nextCursor]
          properties:
            nextCursor:
              type: [string, 'null']
              maxLength: 256
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
