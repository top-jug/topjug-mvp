name: 기능 작업
description: 제품 또는 운영 기능을 제안하고 완료 조건을 합의합니다.
title: ""
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 해결하려는 문제와 기대 결과를 짧게 적어주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 이번 작업에 포함할 핵심 항목만 적어주세요.
      placeholder: |
        - API 또는 화면 변경
        - 필요한 데이터·인프라 변경
        - 핵심 테스트와 문서
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: 제외
      description: 후속 작업으로 남길 항목이 있다면 적어주세요.
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 리뷰에서 확인할 수 있는 결과를 적어주세요.
    validations:
      required: true
