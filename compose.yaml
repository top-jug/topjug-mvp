name: topjug-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: topjug
      POSTGRES_USER: topjug
      POSTGRES_PASSWORD: topjug
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topjug -d topjug"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - topjug-postgres:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: topjug
      MINIO_ROOT_PASSWORD: topjug-local-secret
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - topjug-minio:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 topjug topjug-local-secret &&
      mc mb --ignore-existing local/topjug-media &&
      mc anonymous set download local/topjug-media"

volumes:
  topjug-postgres:
  topjug-minio:
